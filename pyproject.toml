[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlharness"
version = "0.1.0"
description = "A benchmarked semantic compiler and governed execution harness for NL-to-SQL."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0.0",
  "sqlglot>=27.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
retrieval = [
  "fastembed>=0.7.0,<1.0",
]
mcp = [
  "mcp[cli]>=2.0.0,<3.0",
]

[project.scripts]
sqlharness = "graphsql.cli:main"
sqlharness-mcp = "graphsql.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graphsql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
