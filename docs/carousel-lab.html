<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SQLHarness — Carousel component lab</title>
<style>
  :root {
    color-scheme: light;
    --ink:#252222;
    --muted:#746761;
    --paper:#fffaf6;
    --canvas:#b9aaaa;
    --accent:#685044;
    --line:#d8cfca;
  }
  * { box-sizing:border-box; }
  html,body { width:100%; min-width:0; height:100%; margin:0; overflow:hidden; }
  body { color:var(--ink); background:var(--paper); font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
  button,a { font:inherit; }
  button { color:inherit; }
  .workspace { display:grid; grid-template-rows:minmax(250px,44%) minmax(0,56%); width:100%; height:100%; }
  .saved { position:relative; display:grid; min-width:0; min-height:0; grid-template-rows:minmax(0,1fr); border-bottom:1px solid #a79790; background:var(--canvas); }
  .saved__publish { position:absolute; z-index:3; top:14px; right:14px; display:none; height:38px; align-items:center; justify-content:center; padding:0 14px; border:1px solid var(--accent); border-radius:5px; color:var(--paper); background:var(--accent); font-size:12px; font-weight:700; text-decoration:none; }
  .saved__stage { position:relative; min-width:0; min-height:0; overflow:hidden; }
  .saved__frame,.lab__frame { position:absolute; top:50%; left:50%; width:var(--component-frame-width,780px); height:var(--component-frame-height,600px); border:0; background:transparent; transform:translate(-50%,-50%) scale(var(--frame-scale,.55)); transform-origin:center; }
  .lab { display:grid; grid-template-rows:minmax(0,1fr) 38px; width:100%; min-width:0; min-height:0; overflow:hidden; transition:opacity .18s ease; }
  .lab__actions { position:absolute; z-index:3; top:14px; right:14px; display:flex; gap:8px; }
  .lab__keep,.lab__save,.lab__use { display:inline-flex; height:36px; align-items:center; justify-content:center; padding:0 13px; border:1px solid var(--accent); border-radius:5px; font-size:12px; font-weight:650; cursor:pointer; }
  .lab__keep { color:var(--accent); background:rgba(234,223,218,.92); }
  .lab__save { color:var(--accent); background:rgba(255,250,246,.9); }
  .lab__save[data-saved="true"] { color:var(--paper); background:#8a756b; }
  .lab__use { color:var(--paper); background:var(--accent); }
  .lab__use[data-selected="true"] { color:var(--accent); background:#eadfda; }
  .lab__stage { position:relative; display:grid; min-width:0; min-height:0; place-items:center; overflow:hidden; padding:18px 64px; background:var(--canvas); }
  .lab__stage-arrow { position:absolute; z-index:2; top:50%; display:grid; width:44px; height:64px; place-items:center; border:0; border-radius:6px; background:rgba(255,250,246,.92); font-size:25px; transform:translateY(-50%); cursor:pointer; }
  .lab__stage-arrow--previous { left:14px; }
  .lab__stage-arrow--next { right:14px; }
  .lab__footer { display:flex; align-items:center; justify-content:center; gap:5px; border-top:1px solid var(--line); background:var(--paper); }
  .lab__dot { position:relative; display:grid; width:28px; height:24px; place-items:center; padding:0; border:1px solid #c8bbb5; border-radius:3px; color:var(--muted); background:#f3eeea; font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace; cursor:pointer; }
  .lab__dot[aria-current="true"] { color:var(--paper); border-color:var(--accent); background:var(--accent); }
  .lab__dot[data-saved="true"]::after { content:""; position:absolute; top:2px; right:2px; width:5px; height:5px; border-radius:50%; background:#356df3; box-shadow:0 0 0 1px var(--paper); }
  button:focus-visible,a:focus-visible { outline:2px solid #3054c1; outline-offset:2px; }
  @media (max-width:780px) {
    .workspace { grid-template-rows:minmax(220px,40%) minmax(0,60%); }
    .lab { grid-template-rows:minmax(0,1fr) 36px; }
    .lab__stage { padding-right:48px; padding-left:48px; }
  }
  .workspace.workspace--complete { grid-template-rows:minmax(0,1fr) 0; }
  .workspace--complete .saved { border-bottom:0; }
  .workspace--complete .saved__publish { display:inline-flex; }
  .workspace--complete .lab { visibility:hidden; opacity:0; pointer-events:none; }
</style>
</head>
<body>
<div class="workspace">
<section class="saved" aria-label="Saved component version">
  <a class="saved__publish" href="index.html#system" target="_blank" data-publish>Use on Page</a>
  <div class="saved__stage" data-saved-stage>
    <iframe class="saved__frame" title="Saved carousel component" data-saved-preview></iframe>
  </div>
</section>
<main class="lab">
  <section class="lab__stage" aria-label="Component style preview">
    <div class="lab__actions">
      <button class="lab__keep" type="button" data-keep>Keep current style</button>
      <button class="lab__save" type="button" data-save>Save slot</button>
      <button class="lab__use" type="button" data-use>Use this style</button>
    </div>
    <button class="lab__stage-arrow lab__stage-arrow--previous" type="button" data-previous aria-label="Previous design">←</button>
    <iframe class="lab__frame" title="Live carousel component preview" data-preview></iframe>
    <button class="lab__stage-arrow lab__stage-arrow--next" type="button" data-next aria-label="Next design">→</button>
  </section>
  <footer class="lab__footer" aria-label="Choose a design" data-dots></footer>
</main>
</div>

      { key:'sankey-flow', name:'Semantic flow bands', lineage:'21st · ECharts Sankey Chart #31570', description:'Staggered nodes and broad connecting bands emphasize how meaning flows into executable SQL.' },
      { key:'workflow-canvas', name:'Workflow canvas', lineage:'21st · Interactive Workflow Blueprint #43113', description:'A dotted canvas, connected node cards, and tool-like headers turn the table into an architecture map.' },
      { key:'alternating-milestones', name:'Alternating milestones', lineage:'21st · Milestone Timeline Feature #29502', description:'A centered spine alternates stage cards left and right for a narrative process read.' },
    ],
  };
  const labParams = new URLSearchParams(window.location.search);
  const componentLabRegistry = window.SQLHarnessComponentLab;
  const componentDefinition = componentLabRegistry.resolve(labParams.get('component'));
  const componentKind = componentDefinition.id;
  document.documentElement.classList.toggle('query-example-lab', componentKind === 'query-example');
  document.documentElement.style.setProperty('--component-frame-width', `${componentDefinition.preview.width}px`);
  document.documentElement.style.setProperty('--component-frame-height', `${componentDefinition.preview.height}px`);
  document.title = componentDefinition.title;
  const defaults = typeof window.SQLHARNESS_CAROUSEL_STYLE === 'object'
    ? window.SQLHARNESS_CAROUSEL_STYLE
    : { controls:window.SQLHARNESS_CAROUSEL_STYLE || 'utility', header:'signal' };
  const draftStorageKey = `sqlharnessLabDraft:${componentKind}`;
  let selected = componentLabRegistry.readSelection(componentDefinition, defaults);
  try {
    const draftSelection = JSON.parse(localStorage.getItem(draftStorageKey) || 'null');
    if (draftSelection && typeof draftSelection === 'object') {
      selected = { ...selected, ...draftSelection };
    }
  } catch (_error) {}
  const requestedMode = labParams.get('mode');
  let mode = requestedMode && componentDefinition.modes[requestedMode]
    ? requestedMode
    : componentDefinition.defaultMode;
  const draftParamKey = `draft-${mode}`;
  const requestedDraftStyle = labParams.get(draftParamKey);
  if (requestedDraftStyle) {
    selected = { ...selected, [mode]:requestedDraftStyle };
    localStorage.setItem(draftStorageKey, JSON.stringify(selected));
  }
  const variantPools = Object.fromEntries(
    Object.keys(componentDefinition.modes).map((area) => [area, [...(variants[area] || [])]]),
  );
  function resetCandidates() {
    Object.keys(variantPools).forEach((area) => {
      variants[area] = variantPools[area].filter((variant) => variant.key !== selected[area]).slice(0, 10);
    });
  }
  resetCandidates();
  const slotParamKey = `slot-${mode}`;
  const modeDefinition = componentDefinition.modes[mode];
  const slotStorageKey = modeDefinition.slotKey;
  const initialSlot = Number(labParams.get(slotParamKey) || localStorage.getItem(slotStorageKey));
  let index = Number.isInteger(initialSlot) && initialSlot > 0
    ? Math.min(initialSlot - 1, variants[mode].length - 1)
    : mode === 'table' || mode === 'workflow' ? 0 : Math.min(6, variants[mode].length - 1);
  const preview = document.querySelector('[data-preview]');
  const savedPreview = document.querySelector('[data-saved-preview]');
  const workspace = document.querySelector('.workspace');
  const savedStage = document.querySelector('[data-saved-stage]');
  const labStage = document.querySelector('.lab__stage');
  const lab = document.querySelector('.lab');
  const publishButton = document.querySelector('[data-publish]');
  publishButton.href = componentDefinition.publishHref;
  const useButton = document.querySelector('[data-use]');
  const keepButton = document.querySelector('[data-keep]');
  const saveButton = document.querySelector('[data-save]');
  const dots = document.querySelector('[data-dots]');
  const savedStorageKey = modeDefinition.savedKey;
  const seenStorageKey = modeDefinition.seenKey;
  let savedVariants = new Set();
  try { savedVariants = new Set(JSON.parse(localStorage.getItem(savedStorageKey) || '[]')); } catch (_error) {}
  let seenVariants = new Set();
  try { seenVariants = new Set(JSON.parse(localStorage.getItem(seenStorageKey) || '[]')); } catch (_error) {}
  const explorationParams = labParams;
  const savedParamKey = `saved-${mode}`;
  const seenParamKey = `seen-${mode}`;
  const labSession = modeDefinition.session;
  const startsCollapsed = explorationParams.get('done') === labSession;
  (explorationParams.get(savedParamKey) || '').split(',').filter(Boolean).forEach((key) => savedVariants.add(key));
  (explorationParams.get(seenParamKey) || '').split(',').filter(Boolean).forEach((key) => seenVariants.add(key));

  function syncExplorationState() {
    if (savedVariants.size) localStorage.setItem(savedStorageKey, JSON.stringify([...savedVariants]));
    else localStorage.removeItem(savedStorageKey);
    if (seenVariants.size) localStorage.setItem(seenStorageKey, JSON.stringify([...seenVariants]));
    else localStorage.removeItem(seenStorageKey);
    const url = new URL(window.location.href);
    url.searchParams.delete('saved');
    url.searchParams.delete('seen');
    if (!startsCollapsed) url.searchParams.delete('done');
    if (savedVariants.size) url.searchParams.set(savedParamKey, [...savedVariants].join(','));
    else url.searchParams.delete(savedParamKey);
    if (seenVariants.size) url.searchParams.set(seenParamKey, [...seenVariants].join(','));
    else url.searchParams.delete(seenParamKey);
    window.history.replaceState(null, '', url);
  }
  function clearExplorationState() {
    savedVariants.clear();
    seenVariants.clear();
    localStorage.removeItem(savedStorageKey);
    localStorage.removeItem(seenStorageKey);
    localStorage.removeItem(slotStorageKey);
    const url = new URL(window.location.href);
    url.searchParams.delete(slotParamKey);
    window.history.replaceState(null, '', url);
    syncExplorationState();
  }
  if (!startsCollapsed) variants[mode].forEach((variant) => seenVariants.add(variant.key));
  syncExplorationState();

  function currentVariant() { return variants[mode][index]; }
  function syncCurrentSlot() {
    localStorage.setItem(slotStorageKey, String(index + 1));
    const url = new URL(window.location.href);
    url.searchParams.set(slotParamKey, String(index + 1));
    window.history.replaceState(null, '', url);
  }
  function componentUrl(choice, highlight = '') {
    return componentLabRegistry.previewUrl(componentDefinition, choice, highlight);
  }
  function renderSaved(highlight = mode) {
    savedPreview.src = componentUrl(selected, highlight);
  }
  function collapseLab({ persist = true } = {}) {
    renderSaved('');
    if (persist) {
      const url = new URL(window.location.href);
      url.searchParams.set('done', labSession);
      window.history.replaceState(null, '', url);
    }
    workspace.classList.add('workspace--complete');
    lab.setAttribute('aria-hidden', 'true');
    lab.inert = true;
    fitFrames();
  }
  function previewSelection() {
    return { ...selected, [mode]:currentVariant().key };
  }
  function render() {
    const candidate = currentVariant();
    const choice = previewSelection();
    const isSelected = selected[mode] === candidate.key;
    const isSaved = savedVariants.has(candidate.key);
    useButton.dataset.selected = String(isSelected);
    useButton.textContent = isSelected ? 'Using this style' : 'Use this style';
    saveButton.hidden = false;
    saveButton.dataset.saved = String(isSaved);
    saveButton.textContent = isSaved ? `Saved in slot ${index + 1}` : `Save slot ${index + 1}`;
    preview.src = componentUrl(choice);
    dots.replaceChildren(...variants[mode].map((variant, dotIndex) => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'lab__dot';
      const saved = savedVariants.has(variant.key);
      dot.textContent = String(dotIndex + 1);
      dot.dataset.saved = String(saved);
      dot.title = `Slot ${dotIndex + 1}: ${variant.name}${saved ? ' · saved' : ''}`;
      dot.setAttribute('aria-label', `Show slot ${dotIndex + 1}: ${variant.name}${saved ? ', saved' : ''}`);
      dot.setAttribute('aria-current', String(dotIndex === index));
      dot.addEventListener('click', () => { index = dotIndex; syncCurrentSlot(); render(); });
      return dot;
    }));
  }
  function show(nextIndex) {
    index = (nextIndex + variants[mode].length) % variants[mode].length;
    syncCurrentSlot();
    render();
  }
  document.querySelectorAll('[data-previous]').forEach((button) => button.addEventListener('click', () => show(index - 1)));
  document.querySelectorAll('[data-next]').forEach((button) => button.addEventListener('click', () => show(index + 1)));
  document.querySelectorAll('[data-mode]').forEach((button) => button.addEventListener('click', () => {
    const url = new URL(window.location.href);
    url.searchParams.set('mode', button.dataset.mode);
    window.location.href = url;
  }));
  useButton.addEventListener('click', () => {
    selected = { ...selected, ...previewSelection() };
    localStorage.setItem(draftStorageKey, JSON.stringify(selected));
    const draftUrl = new URL(window.location.href);
    draftUrl.searchParams.set(draftParamKey, selected[mode]);
    window.history.replaceState(null, '', draftUrl);
    clearExplorationState();
    resetCandidates();
    index = 0;
    renderSaved('');
    render();
    collapseLab();
  });
  publishButton.addEventListener('click', () => {
    componentLabRegistry.writeSelection(componentDefinition, selected);
    localStorage.removeItem(draftStorageKey);
    const url = new URL(window.location.href);
    url.searchParams.delete(draftParamKey);
    window.history.replaceState(null, '', url);
  });
  keepButton.addEventListener('click', () => {
    localStorage.removeItem(draftStorageKey);
    selected = componentLabRegistry.readSelection(componentDefinition, defaults);
    const url = new URL(window.location.href);
    url.searchParams.delete(draftParamKey);
    window.history.replaceState(null, '', url);
    clearExplorationState();
    index = 0;
    renderSaved('');
    render();
    collapseLab();
  });
  saveButton.addEventListener('click', () => {
    const key = currentVariant().key;
    if (savedVariants.has(key)) savedVariants.delete(key);
    else savedVariants.add(key);
    syncExplorationState();
    render();
  });
  window.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowLeft') show(index - 1);
    if (event.key === 'ArrowRight') show(index + 1);
  });
  function fitFrames() {
    const frames = [
      [savedStage, savedPreview],
      [labStage, preview],
    ];
    const activeFrames = workspace.classList.contains('workspace--complete') ? frames.slice(0, 1) : frames;
    const scale = Math.min(
      1,
      ...activeFrames.flatMap(([stage]) => [
        (stage.clientWidth - 24) / componentDefinition.preview.width,
        (stage.clientHeight - 18) / componentDefinition.preview.height,
      ]),
    );
    const fittedScale = Math.max(.28, scale).toFixed(3);
    activeFrames.forEach(([, frame]) => frame.style.setProperty('--frame-scale', fittedScale));
  }
  const frameObserver = new ResizeObserver(fitFrames);
  [workspace, savedStage, labStage].forEach((element) => frameObserver.observe(element));
  renderSaved();
  if (!startsCollapsed) syncCurrentSlot();
  render();
  if (startsCollapsed) collapseLab({ persist:false });
  else fitFrames();
</script>
</body>
</html>
